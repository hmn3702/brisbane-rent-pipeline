name: rent_dbt
version: "1.0.0"
config-version: 2
profile: rent_dbt

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["../config"]     # single source of truth: the same suburbs.csv the Domain ingest uses
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # how many quarters back the rent-gap mart may look for an RTA figure (RTA suppresses small cells)
  max_rta_lag_quarters: 2
  # RTA bedroom buckets the Domain listings are clamped into (see int_domain__listings)
  rta_bedroom_buckets:
    Flat: [1, 3]
    House: [2, 4]
    Townhouse: [2, 3]

models:
  rent_dbt:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  rent_dbt:
    +schema: ref
    suburbs:
      +column_types:
        postcode: text
