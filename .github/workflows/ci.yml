name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d rent"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rent
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/rent
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: rent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit and integration tests (pytest)
        run: pytest -q

      - name: Create raw schemas
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/001_raw_schema.sql -f sql/002_rta_schema.sql -f sql/003_ingest_log.sql

      - name: Load RTA fixture through the real parser
        run: |
          python scripts/make_rta_fixture.py data/raw/rta/rta-bond-statistics.xlsx
          python ingest_rta.py --geo suburb,state --if-changed     # same flags as the scheduled pipeline
          python ingest_rta.py --geo suburb,state --if-changed     # second run must skip (unchanged)

      - name: Load synthetic Domain listings
        run: python scripts/generate_fake_domain.py --start 2026-07-01 --end 2026-11-18 --truncate

      - name: dbt build (seed, models, tests)
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt build --profiles-dir . --fail-fast

      - name: Export marts (smoke test)
        run: python scripts/export_marts.py

      - name: dbt build with no Domain data (state before API access)
        working-directory: dbt
        run: |
          psql "$DATABASE_URL" -c "TRUNCATE raw.domain_rent_listings"
          dbt build --profiles-dir . --fail-fast

  docker:
    name: docker compose (make demo + make test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: make build

      - name: make demo (full pipeline in containers)
        run: make demo

      - name: make demo again (RTA must be skipped as unchanged)
        run: set -o pipefail; make demo 2>&1 | tee rerun.log && grep -q "workbook unchanged" rerun.log

      - name: make test (pytest against rent_test)
        run: make test

      - name: Exported CSVs exist
        run: |
          ls -la powerbi/data
          test -s powerbi/data/mart_rta_seasonality.csv
          test -s powerbi/data/manifest.json

      - name: Tear down
        if: always()
        run: make clean
