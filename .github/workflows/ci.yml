name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d rent"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rent
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/rent
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: rent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit and integration tests (pytest)
        run: pytest -q

      - name: Create raw schemas
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/001_raw_schema.sql -f sql/002_rta_schema.sql

      - name: Load RTA fixture through the real parser
        run: |
          python scripts/make_rta_fixture.py data/raw/rta/rta-bond-statistics.xlsx
          python ingest_rta.py

      - name: Load synthetic Domain listings
        run: python scripts/generate_fake_domain.py --start 2026-07-01 --end 2026-11-18 --truncate

      - name: dbt build (seed, models, tests)
        working-directory: dbt
        run: |
          cp profiles.yml.example profiles.yml
          dbt build --profiles-dir . --fail-fast

      - name: Export marts (smoke test)
        run: python scripts/export_marts.py
