name: quarterly-rta-ingest
on:
  schedule:
    - cron: "43 22 20 1,4,7,10 *"   # 20th of Jan/Apr/Jul/Oct (RTA publishes ~ start of those months)
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ingest_rta.py --download
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
