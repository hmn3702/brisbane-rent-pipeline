name: quarterly-rta-ingest
on:
  schedule:
    - cron: "43 22 20 1,4,7,10 *"   # 20th of Jan/Apr/Jul/Oct (RTA publishes ~ start of those months)
  workflow_dispatch: {}
jobs:
  check-config:
    # Skip cleanly (instead of failing every run) until the repository secrets are set.
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Secrets not configured; skipping ingest."; fi

  ingest:
    needs: check-config
    if: needs.check-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ingest_rta.py --download
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
