name: daily-domain-ingest
on:
  schedule:
    - cron: "17 20 * * *"   # 06:17 Brisbane time (UTC+10)
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python ingest_domain.py
        env:
          DOMAIN_CLIENT_ID: ${{ secrets.DOMAIN_CLIENT_ID }}
          DOMAIN_CLIENT_SECRET: ${{ secrets.DOMAIN_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
